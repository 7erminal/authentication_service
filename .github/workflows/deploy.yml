# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "shopmallafrik" ]
  pull_request:
    branches: [ "shopmallafrik" ]

jobs:

  build:
    runs-on: ubuntu-latest
    environment: shopmallafrik
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_SERVER: ${{ vars.SSH_SERVER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        ssh -o StrictHostKeyChecking=no root@$SSH_SERVER << 'EOF'
          set -e

          # Load login shell environment so PATH/NVM-installed pm2 is available.
          [ -f ~/.bashrc ] && . ~/.bashrc || true
          [ -f ~/.profile ] && . ~/.profile || true
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true

          cd /usr/app/shopmallafrik/authentication_service/
          git stash
          git pull origin shopmallafrik
          go build -o shopmallafrik-authentication-service

          PM2_BIN="$(command -v pm2 || true)"
          if [ -z "$PM2_BIN" ]; then
            echo "pm2 not found in PATH: $PATH"
            exit 1
          fi

          "$PM2_BIN" restart shopmallafrik-authentication-service || \
          "$PM2_BIN" start ./shopmallafrik-authentication-service --name shopmallafrik-authentication-service
        EOF