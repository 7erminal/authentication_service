apiVersion: apps/v1
kind: Deployment
metadata:
  name: naki-authentication-service
  namespace: naki
  labels:
    app: naki-authentication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: naki-authentication-service
  template:
    metadata:
      labels:
        app: naki-authentication-service
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: naki-authentication-service
          image: nakiacrplatform.azurecr.io/samples/naki:naki-authentication-service-19
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: naki-authentication-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: naki-authentication-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: naki-authentication-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: naki-authentication-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: naki-authentication-secrets
                  key: DB_PASSWORD
            - name: APP_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: naki-authentication-config
                  key: APP_HTTP_PORT
            - name: BEEGO_RUNMODE
              valueFrom:
                configMapKeyRef:
                  name: naki-authentication-config
                  key: BEEGO_RUNMODE
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 12
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
